services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: housen
      POSTGRES_PASSWORD: housen_dev
      POSTGRES_DB: housen
    volumes:
      - housen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housen -d housen"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: node:22-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://housen:housen_dev@db:5432/housen?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_TELEMETRY_DISABLED=1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        apt-get update -qq && apt-get install -y -qq openssl > /dev/null 2>&1
        npm install
        npx prisma generate
        npx prisma db push --accept-data-loss
        npx prisma db seed
        rm -rf .next
        exec npx next dev --turbo -H 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  housen_pgdata:
