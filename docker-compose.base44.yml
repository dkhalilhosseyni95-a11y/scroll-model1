# Base44 development stack for the MOON ULTIMATE theme.
#
# Runs from the cloned checkout: the theme and both companion plugins are
# bind-mounted into WordPress, so edits appear without rebuilding anything.
# WordPress core lives in the `wp_core` volume and is installed by the
# one-shot `setup` service on first boot.
#
# Web entry point: host port 3000.

name: moon

services:
  db:
    image: mariadb:11.4
    restart: on-failure
    command: ["--skip-name-resolve", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: moon
      MARIADB_USER: moon
      MARIADB_PASSWORD: moon_local_db
      MARIADB_ROOT_PASSWORD: moon_local_root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    image: wordpress:php8.2-apache
    restart: on-failure
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: moon
      WORDPRESS_DB_USER: moon
      WORDPRESS_DB_PASSWORD: moon_local_db
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '256M');
        define('MOON_SANDBOX', true);
      # Consumed by tools/sandbox/base44-preview.php (sandbox only).
      BASE44_PREVIEW_MODE:
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ${BASE44_PROJECT_ROOT}/moon-ultimate:/var/www/html/wp-content/themes/moon-ultimate
      - ${BASE44_PROJECT_ROOT}/moon-companion:/var/www/html/wp-content/plugins/moon-companion
      - ${BASE44_PROJECT_ROOT}/moon-demo-importer:/var/www/html/wp-content/plugins/moon-demo-importer
      - ${BASE44_PROJECT_ROOT}/tools/sandbox:/var/www/html/wp-content/mu-plugins:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/wp-login.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 60s

  cli:
    image: wordpress:cli-php8.2
    restart: "no"
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: moon
      WORDPRESS_DB_USER: moon
      WORDPRESS_DB_PASSWORD: moon_local_db
      WORDPRESS_TABLE_PREFIX: wp_
      WP_ADMIN_PASSWORD: moon_local_admin
      BASE44_PREVIEW_MODE:
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ${BASE44_PROJECT_ROOT}/moon-ultimate:/var/www/html/wp-content/themes/moon-ultimate
      - ${BASE44_PROJECT_ROOT}/moon-companion:/var/www/html/wp-content/plugins/moon-companion
      - ${BASE44_PROJECT_ROOT}/moon-demo-importer:/var/www/html/wp-content/plugins/moon-demo-importer
      - ${BASE44_PROJECT_ROOT}/tools/sandbox:/var/www/html/wp-content/mu-plugins:ro
    entrypoint: ["wp", "--path=/var/www/html", "--allow-root"]

  # The uploads volume starts owned by root while Apache and WP-CLI run as
  # www-data (uid 33). Normalise it once so media uploads and plugin installs
  # work.
  perms:
    image: wordpress:cli-php8.2
    restart: "no"
    user: "0:0"
    depends_on:
      wordpress:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/www/html/wp-content/uploads /var/www/html/wp-content/upgrade
        chown -R 33:33 /var/www/html/wp-content/uploads /var/www/html/wp-content/upgrade
        echo "permissions ready"
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads

  # First boot: WordPress core, WooCommerce, theme, plugins, Persian language
  # and the demo catalogue. Idempotent — safe on every `up`.
  setup:
    image: wordpress:cli-php8.2
    restart: "no"
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
      perms:
        condition: service_completed_successfully
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: moon
      WORDPRESS_DB_USER: moon
      WORDPRESS_DB_PASSWORD: moon_local_db
      WORDPRESS_TABLE_PREFIX: wp_
      WP_ADMIN_PASSWORD: moon_local_admin
      BASE44_PREVIEW_MODE:
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ${BASE44_PROJECT_ROOT}/moon-ultimate:/var/www/html/wp-content/themes/moon-ultimate
      - ${BASE44_PROJECT_ROOT}/moon-companion:/var/www/html/wp-content/plugins/moon-companion
      - ${BASE44_PROJECT_ROOT}/moon-demo-importer:/var/www/html/wp-content/plugins/moon-demo-importer
      - ${BASE44_PROJECT_ROOT}/tools/sandbox:/var/www/html/wp-content/mu-plugins:ro
      - ${BASE44_PROJECT_ROOT}/tools:/opt/moon:ro
    entrypoint: ["/bin/sh", "/opt/moon/container-setup.sh"]

volumes:
  db_data:
  wp_core:
  wp_uploads:
