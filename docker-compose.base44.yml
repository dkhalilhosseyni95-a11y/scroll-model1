# Base44 development stack for the MOON storefront (Moon Core plugin).
#
# Everything runs from the cloned source: the plugin directory is bind-mounted and
# WordPress core lives in a named volume, so editing plugins/moon-core/ is visible
# immediately. The storefront is served on host port 3000 (the preview entry point).

name: moon

services:
  db:
    image: mariadb:11.4
    restart: on-failure
    environment:
      MARIADB_DATABASE: moon
      MARIADB_USER: moon
      MARIADB_PASSWORD: moon_local_db
      MARIADB_ROOT_PASSWORD: moon_local_root
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  wordpress:
    image: wordpress:7.1.4-php8.2-apache
    restart: on-failure
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./sandbox/.env.defaults
      - /run/base44/app.env
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: moon
      WORDPRESS_DB_USER: moon
      WORDPRESS_DB_PASSWORD: moon_local_db
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('DISALLOW_FILE_EDIT', true);
        define('FS_METHOD', 'direct');
        define('WP_ENVIRONMENT_TYPE', 'local');
      # Used by the preview mu-plugin and the installer. Empty on production.
      BASE44_PREVIEW_MODE:
      MOON_PREVIEW_ORIGIN: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      MOON_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./plugins/moon-core:/var/www/html/wp-content/plugins/moon-core
      - ./sandbox/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./sandbox/healthcheck.php:/opt/moon/healthcheck.php:ro
    healthcheck:
      test: ["CMD", "php", "/opt/moon/healthcheck.php"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 60s

  # The uploads volume starts owned by root while Apache and WP-CLI run as
  # www-data (33); hand it over once so media import and image sizes work.
  perms:
    image: wordpress:7.1.4-php8.2-apache
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/www/html/wp-content/uploads
        chown -R 33:33 /var/www/html/wp-content
        echo "wp-content ownership ready"
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads

  # One-shot, idempotent installer: WordPress core, Persian locale, Hello Elementor,
  # Elementor + WooCommerce, Moon Core activation and the demo import.
  setup:
    image: wordpress:cli-php8.3
    restart: "no"
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
      perms:
        condition: service_completed_successfully
    env_file:
      - ./sandbox/.env.defaults
      - /run/base44/app.env
    environment:
      BASE44_PREVIEW_MODE:
      MOON_PREVIEW_ORIGIN: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # wp-config.php resolves the DB constants at runtime, so WP-CLI needs them too.
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: moon
      WORDPRESS_DB_USER: moon
      WORDPRESS_DB_PASSWORD: moon_local_db
      WORDPRESS_TABLE_PREFIX: wp_
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./plugins/moon-core:/var/www/html/wp-content/plugins/moon-core
      - ./sandbox/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./sandbox:/opt/moon:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /opt/moon/setup.sh"]

  # Interactive WP-CLI:
  #   docker compose -f docker-compose.base44.yml run --rm cli plugin list
  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    env_file:
      - ./sandbox/.env.defaults
      - /run/base44/app.env
    environment:
      BASE44_PREVIEW_MODE:
      MOON_PREVIEW_ORIGIN: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: moon
      WORDPRESS_DB_USER: moon
      WORDPRESS_DB_PASSWORD: moon_local_db
      WORDPRESS_TABLE_PREFIX: wp_
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./plugins/moon-core:/var/www/html/wp-content/plugins/moon-core
      - ./sandbox/mu-plugins:/var/www/html/wp-content/mu-plugins
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_core:
  wp_uploads:
