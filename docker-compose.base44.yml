# Base44 sandbox environment for the MOON WordPress theme.
#
# WordPress core lives in a named volume; the theme and the demo importer plugin
# are bind-mounted from this repository so every edit is served immediately.
# A one-shot wp-cli service installs WordPress, WooCommerce and the demo content.
#
# The theme and the importer are the two deliverable packages: nothing here is
# baked into an image, so `moon-theme-final.zip` and the importer zip can be
# rebuilt from the exact source that runs in the sandbox.

name: moon

services:
  db:
    image: mariadb:11.4
    restart: on-failure
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: moon_dev_password
      MARIADB_ROOT_PASSWORD: moon_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:php8.3-apache
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: moon_dev_password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_MEMORY_LIMIT', '256M' );
      BASE44_PREVIEW_MODE:
      BASE44_PUBLIC_HOST_SUFFIX:
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/moon-theme:/var/www/html/wp-content/themes/moon-theme
      - ./wp-content/plugins/moon-demo-importer:/var/www/html/wp-content/plugins/moon-demo-importer
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1/wp-login.php') ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  setup:
    # Installs WordPress, WooCommerce and the demo content, then keeps the
    # container running so the sandbox health check can confirm the install.
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    restart: on-failure
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: moon_dev_password
      WORDPRESS_DB_NAME: wordpress
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      MOON_ADMIN_USER: admin
      MOON_ADMIN_PASSWORD: moon-dev-admin
      MOON_ADMIN_EMAIL: admin@moon.local
      BASE44_PREVIEW_MODE:
      BASE44_PUBLIC_HOST_SUFFIX:
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/moon-theme:/var/www/html/wp-content/themes/moon-theme
      - ./wp-content/plugins/moon-demo-importer:/var/www/html/wp-content/plugins/moon-demo-importer
      - ./docker:/scripts:ro
    command: ["sh", "-c", "sh /scripts/setup.sh && touch /var/www/html/.moon-setup-ok && exec tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/.moon-setup-ok && wp core is-installed --path=/var/www/html >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  db_data:
  wp_data:
